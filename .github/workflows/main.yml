name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build bashbot zip
        run: |
          mkdir -p dist/app
          cp -r bashbot macros LICENSE README.md config.toml.example requirements.txt dist/app/
          cp bashbot.py dist/app/__main__.py
          python -m pip install -r requirements.txt -t dist/app
          echo '{"version": "${{ github.sha }}"}' > dist/app/build.json
          cd dist/app
          zip -r ../../BashBot.zip .

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "tag-${{ github.sha }}" BashBot.zip --title "Release ${{ github.sha }}" --notes "Automated BashBot build."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: adikso/bashbot:latest,adikso/bashbot:${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
